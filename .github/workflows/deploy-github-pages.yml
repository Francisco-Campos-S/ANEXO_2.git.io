# Publica el sitio en GitHub Pages e inyecta la clave Gemini desde el secreto del repo (no va en el código).
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Inyectar gemini-config.js desde secreto GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const k = process.env.GEMINI_API_KEY || '';
          const out = '/* Generado en CI — no editar */\nwindow.GEMINI_API_KEY = ' + JSON.stringify(k) + ';\n';
          fs.writeFileSync('gemini-config.js', out);
          NODE

      - name: Quitar historial Git del artefacto
        run: rm -rf .git

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
